name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  powershell:
    name: PowerShell (syntax + PSScriptAnalyzer)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Local: pwsh ./build/Invoke-Lint.ps1
      - name: Syntax check + PSScriptAnalyzer (PSScriptAnalyzerSettings.psd1)
        shell: pwsh
        run: ./build/Invoke-Lint.ps1
      # Local: pwsh ./tests/Test-DetectionCommon.ps1
      - name: DetectionCommon self-test
        shell: pwsh
        run: ./tests/Test-DetectionCommon.ps1

  module-windows:
    name: DetectionCommon on Windows (5.1 + 7)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Self-test (PowerShell 7)
        shell: pwsh
        run: ./tests/Test-DetectionCommon.ps1
      - name: Self-test (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/Test-DetectionCommon.ps1
