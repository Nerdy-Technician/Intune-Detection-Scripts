name: Validate

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate repository
        shell: pwsh
        run: ./build/Test-Repository.ps1

      - name: Verify package build
        shell: pwsh
        run: ./build/pack.ps1 -Version v0.0.0
