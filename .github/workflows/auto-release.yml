name: Auto Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate Repository
        shell: pwsh
        run: ./build/Test-Repository.ps1
      - name: Compute & Bump Version
        id: version
        shell: pwsh
        run: |
          $tags = git tag | Where-Object { $_ -match '^v[0-9]+\.[0-9]+\.[0-9]+$' }
          if ($tags) {
            $latest = ($tags | Sort-Object { $_ -replace 'v','' -as [version] } | Select-Object -Last 1)
            $vObj = [version]($latest -replace 'v','')
            $next = [version]::new($vObj.Major, $vObj.Minor, $vObj.Build + 1)
            $newTag = "v$($next.ToString())"
          } else { $newTag = 'v1.0.0' }
          Write-Host "Next tag: $newTag"
          echo "tag=$newTag" >> $env:GITHUB_OUTPUT
      - name: Tag Repo
        shell: pwsh
        env:
          VERSION_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $tag = $env:VERSION_TAG
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'
          git tag $tag
          git push origin $tag
      - name: Package Scripts
        id: pack
        shell: pwsh
        env:
          VERSION_TAG: ${{ steps.version.outputs.tag }}
        run: |
          pwsh build/pack.ps1 -Version $env:VERSION_TAG
      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          files: build/output/*.zip
          generate_release_notes: true
